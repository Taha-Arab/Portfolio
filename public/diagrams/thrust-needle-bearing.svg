<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Shaft axis -->
  <line x1="300" y1="20" x2="300" y2="420" stroke-dasharray="2 6" stroke-width="1" opacity="0.6" />

  <!-- Exploded stack, front-on ellipses, top to bottom: washer, needle bearing, washer -->
  <!-- Top thrust washer -->
  <g opacity="0.95">
    <ellipse cx="300" cy="90" rx="150" ry="42" />
    <ellipse cx="300" cy="90" rx="46" ry="13" />
  </g>

  <!-- connecting lines -->
  <line x1="150" y1="90" x2="150" y2="180" opacity="0.5" />
  <line x1="450" y1="90" x2="450" y2="180" opacity="0.5" />
  <line x1="254" y1="90" x2="254" y2="180" opacity="0.3" />
  <line x1="346" y1="90" x2="346" y2="180" opacity="0.3" />

  <!-- Needle bearing cage with rollers -->
  <g opacity="0.95">
    <ellipse cx="300" cy="210" rx="150" ry="42" />
    <ellipse cx="300" cy="210" rx="46" ry="13" />
    <!-- needle rollers radiating around the race -->
    <g stroke-width="1.6">
      <line x1="300" y1="172" x2="300" y2="182" />
      <line x1="252" y1="176" x2="255" y2="186" />
      <line x1="208" y1="188" x2="214" y2="197" />
      <line x1="175" y1="205" x2="183" y2="211" />
      <line x1="175" y1="215" x2="183" y2="209" />
      <line x1="208" y1="232" x2="214" y2="223" />
      <line x1="252" y1="244" x2="255" y2="234" />
      <line x1="300" y1="248" x2="300" y2="238" />
      <line x1="348" y1="244" x2="345" y2="234" />
      <line x1="392" y1="232" x2="386" y2="223" />
      <line x1="425" y1="215" x2="417" y2="209" />
      <line x1="425" y1="205" x2="417" y2="211" />
      <line x1="392" y1="188" x2="386" y2="197" />
      <line x1="348" y1="176" x2="345" y2="186" />
    </g>
  </g>

  <!-- connecting lines -->
  <line x1="150" y1="210" x2="150" y2="300" opacity="0.5" />
  <line x1="450" y1="210" x2="450" y2="300" opacity="0.5" />
  <line x1="254" y1="210" x2="254" y2="300" opacity="0.3" />
  <line x1="346" y1="210" x2="346" y2="300" opacity="0.3" />

  <!-- Bottom thrust washer -->
  <g opacity="0.95">
    <ellipse cx="300" cy="330" rx="150" ry="42" />
    <ellipse cx="300" cy="330" rx="46" ry="13" />
  </g>

  <!-- axial load arrows -->
  <g opacity="0.7">
    <line x1="120" y1="20" x2="120" y2="70" />
    <path d="M112 62 L120 76 L128 62" />
    <line x1="480" y1="400" x2="480" y2="350" />
    <path d="M472 358 L480 344 L488 358" />
  </g>
</svg>
